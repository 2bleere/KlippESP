; KlippESP - Klipper display for Waveshare ESP32-S3-Touch-LCD-7 (800x480, GT911, CH422G)
[env:waveshare_s3_lcd7]
platform = espressif32@6.5.0
board = esp32-s3-devkitc-1
framework = arduino

; ESP32-S3-N16R8: 16MB QIO flash, 8MB octal PSRAM
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.f_cpu = 240000000L

monitor_speed = 115200
upload_speed = 921600

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DLV_CONF_INCLUDE_SIMPLE
    -DCORE_DEBUG_LEVEL=1
    -Iinclude
    -O2

lib_deps =
    moononournation/GFX Library for Arduino@1.4.7
    lvgl/lvgl@8.3.11
    bblanchon/ArduinoJson@7.0.4

; Over-the-air upload to a running display:  pio run -e waveshare_s3_lcd7_ota -t upload
; (set upload_port to the display's IP, shown on its screen)
[env:waveshare_s3_lcd7_ota]
extends = env:waveshare_s3_lcd7
upload_protocol = espota
upload_port = 192.168.3.19
