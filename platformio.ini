; KlippESP (WT32-SC01 branch) - Klipper touch display for the Wireless-Tag WT32-SC01 (V3.3)
; ESP32-D0WD, 4 MB flash, no PSRAM, 3.5" ST7796 480x320 over SPI, FT6336U capacitive touch
[platformio]
; own PlatformIO directory: the Waveshare build (main) rebuilds the shared Arduino core libraries with custom ESP-IDF
; options, and a stock build here would replace them (and vice versa), forcing a 15-minute rebuild on every switch
core_dir = ${sysenv.HOME}/.platformio-wt32

[env:wt32_sc01]
; Arduino core 3.3.12 / ESP-IDF 5.5.5 (pioarduino), same as the Waveshare build. Needs PlatformIO Core 6.2+.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32dev
framework = arduino

board_build.partitions = min_spiffs.csv   ; two 1.9 MB app slots for OTA
board_build.f_cpu = 240000000L

monitor_speed = 115200
upload_speed = 921600

build_flags =
    -DLV_CONF_INCLUDE_SIMPLE
    -DCORE_DEBUG_LEVEL=1
    -Iinclude
    -O2

lib_deps =
    lovyan03/LovyanGFX@1.2.28
    lvgl/lvgl@8.3.11
    bblanchon/ArduinoJson@7.0.4

; Over-the-air upload to a running display:  pio run -e wt32_sc01_ota -t upload
; (set upload_port to the display's IP, shown in Settings > System)
[env:wt32_sc01_ota]
extends = env:wt32_sc01
upload_protocol = espota
upload_port = 192.168.3.27
