; KlippESP (WT32-SC01 branch) - Klipper touch display for the Wireless-Tag WT32-SC01 (V3.3)
; ESP32-D0WD, 4 MB flash, no PSRAM, 3.5" ST7796 480x320 over SPI, FT6336U capacitive touch
[env:wt32_sc01]
platform = espressif32@6.5.0
board = esp32dev
framework = arduino

board_build.partitions = min_spiffs.csv   ; two 1.9 MB app slots for OTA
board_build.f_cpu = 240000000L

monitor_speed = 115200
upload_speed = 921600

build_flags =
    -DLV_CONF_INCLUDE_SIMPLE
    -DCORE_DEBUG_LEVEL=1
    -Iinclude
    -O2

lib_deps =
    lovyan03/LovyanGFX@1.1.16
    lvgl/lvgl@8.3.11
    bblanchon/ArduinoJson@7.0.4

; Over-the-air upload to a running display:  pio run -e wt32_sc01_ota -t upload
; (set upload_port to the display's IP, shown in Settings > System)
[env:wt32_sc01_ota]
extends = env:wt32_sc01
upload_protocol = espota
upload_port = 192.168.0.0
