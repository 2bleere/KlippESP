; KlippESP - one code base, one environment per supported display:
;   pio run -e waveshare_s3_lcd7 -t upload     Waveshare ESP32-S3-Touch-LCD-7 (800x480, PSRAM)
;   pio run -e wt32_sc01 -t upload             Wireless-Tag WT32-SC01 V3.3 (480x320, no PSRAM)
; Over the air: the *_ota environments (set upload_port to the display's IP).
; Arduino core 3.3.12 / ESP-IDF 5.5.5 (pioarduino); needs PlatformIO Core 6.2+.
;
; Building both boards on one machine: use tools/pio instead of pio. The Waveshare environment recompiles the
; shared Arduino core libraries with custom ESP-IDF options; building another board in the same PlatformIO
; directory reinstalls them (15-minute rebuild on every switch). tools/pio gives each board its own directory.

[platformio]
default_envs = waveshare_s3_lcd7, wt32_sc01

[common]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
upload_speed = 921600
extra_scripts = pre:tools/touch_about.py   ; keeps the About screen build time current
build_flags =
    -DLV_CONF_INCLUDE_SIMPLE
    -DCORE_DEBUG_LEVEL=1
    -Iinclude
    -O2
lib_deps =
    lvgl/lvgl@8.3.11
    bblanchon/ArduinoJson@7.0.4

; ---------------------------------------------------------------- Waveshare ESP32-S3-Touch-LCD-7
[env:waveshare_s3_lcd7]
extends = common
board = esp32-s3-devkitc-1
; ESP32-S3-N16R8: 16 MB QIO flash, 8 MB octal PSRAM
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.f_cpu = 240000000L
build_flags =
    ${common.build_flags}
    -DBOARD_WAVESHARE_S3_LCD7
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
; Code + read-only data run from PSRAM, so flash writes (OTA) no longer stall the PSRAM bus; together with the
; RGB driver's bounce buffers the panel keeps refreshing during an update. Rebuilds the core libraries once (~15 min).
custom_sdkconfig =
    CONFIG_SPIRAM_XIP_FROM_PSRAM=y
    CONFIG_LCD_RGB_ISR_IRAM_SAFE=y
    CONFIG_LCD_RGB_RESTART_IN_VSYNC=y

[env:waveshare_s3_lcd7_ota]
extends = env:waveshare_s3_lcd7
upload_protocol = espota
upload_port = 192.168.3.18

; ---------------------------------------------------------------- WT32-SC01 V3.3
[env:wt32_sc01]
extends = common
board = esp32dev
board_build.partitions = min_spiffs.csv   ; two 1.9 MB app slots for OTA
board_build.f_cpu = 240000000L
build_flags =
    ${common.build_flags}
    -DBOARD_WT32_SC01
lib_deps =
    ${common.lib_deps}
    lovyan03/LovyanGFX@1.2.28

[env:wt32_sc01_ota]
extends = env:wt32_sc01
upload_protocol = espota
upload_port = 192.168.3.27
